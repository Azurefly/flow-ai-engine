name: flow-ai-engine

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # 目标主机当前约 3.3 GiB 且无 Swap。限制核心容器合计为 2.25 GiB，
    # 为宿主系统和运维进程保留余量，同时严格低于部署上限 8 GiB。
    mem_limit: 1536m
    mem_reservation: 768m
    memswap_limit: 1536m
    environment:
      MYSQL_DATABASE: flow_ai_engine
      MYSQL_USER: flow_ai
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - flow_ai_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_ID: ${BUILD_ID:-not-injected}
        BUILD_TIME: ${BUILD_TIME:-not-injected}
    image: flow-ai-engine:local
    restart: unless-stopped
    user: "1000:1000"
    mem_limit: 768m
    mem_reservation: 256m
    memswap_limit: 768m
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://flow_ai:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/flow_ai_engine
      FLOW_BOOTSTRAP_ADMIN_USERNAME: ${FLOW_BOOTSTRAP_ADMIN_USERNAME:?FLOW_BOOTSTRAP_ADMIN_USERNAME is required}
      FLOW_BOOTSTRAP_ADMIN_PASSWORD: ${FLOW_BOOTSTRAP_ADMIN_PASSWORD:?FLOW_BOOTSTRAP_ADMIN_PASSWORD is required}
      # Keep the signing key independent from the bootstrap administrator password.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL_PRICING_JSON: ${LLM_MODEL_PRICING_JSON:-}
      IMAGE_ID: ${IMAGE_ID:-not-injected}
      WORKFLOW_WORKER_ENABLED: ${WORKFLOW_WORKER_ENABLED:-true}
      DATA_CONNECTOR_ALLOWED_HOSTS: ${DATA_CONNECTOR_ALLOWED_HOSTS:-mysql}
      FLOW_SECRET_FILE_DIR: /run/flow-secrets
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${FLOW_HTTP_PORT:-1180}:3000"
    read_only: true
    volumes:
      - type: bind
        source: ${FLOW_SECRET_DIR:-/opt/flow-ai-engine/secrets}
        target: /run/flow-secrets
        read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - backend
      - frontend

volumes:
  flow_ai_mysql_data:

networks:
  backend:
    internal: true
  frontend:
