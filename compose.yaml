name: flow-ai-engine

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: flow_ai_engine
      MYSQL_USER: flow_ai
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - flow_ai_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: flow-ai-engine:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://flow_ai:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/flow_ai_engine
      FLOW_BOOTSTRAP_ADMIN_USERNAME: ${FLOW_BOOTSTRAP_ADMIN_USERNAME:?FLOW_BOOTSTRAP_ADMIN_USERNAME is required}
      FLOW_BOOTSTRAP_ADMIN_PASSWORD: ${FLOW_BOOTSTRAP_ADMIN_PASSWORD:?FLOW_BOOTSTRAP_ADMIN_PASSWORD is required}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${FLOW_HTTP_PORT:-1180}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - backend
      - frontend

volumes:
  flow_ai_mysql_data:

networks:
  backend:
    internal: true
  frontend:
